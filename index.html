<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G Events</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:white;
text-align:center;
padding:20px;
}

/* -------- SITE CONTENT (θα φαίνεται θολό) -------- */

#siteContent{
filter: blur(10px);
pointer-events:none;
}

h1{
margin-top:10px;
}

.divider{
width:60%;
margin:20px auto;
border:1px solid #333;
}

.card{
background:#1c1c1c;
padding:20px;
border-radius:18px;
margin:20px auto;
max-width:500px;
}

button{
width:100%;
padding:14px;
margin:8px 0;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

.join-btn{background:#4CAF50;color:white;}
.contact-btn{background:purple;color:white;}
.viewMega{background:#4da6ff;color:white;}

/* -------- MAINTENANCE POPUP -------- */

#maintenancePopup{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.65);
z-index:9999;
animation:fadeIn 0.5s ease;
}

.popupBox{
background:#1c1c1c;
padding:35px;
border-radius:20px;
text-align:center;
width:320px;
animation:popupSlide 0.6s ease;
}

.popupBox h2{
margin:10px 0;
}

.popupBox p{
font-size:14px;
color:#ddd;
}

.popupBox button{
margin-top:15px;
background:purple;
color:white;
}

.emoji{
font-size:42px;
}

/* -------- ANIMATIONS -------- */

@keyframes popupSlide{
from{
transform:translateY(70px);
opacity:0;
}
to{
transform:translateY(0);
opacity:1;
}
}

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

</style>
</head>

<body>

<!-- POPUP -->

<div id="maintenancePopup">

<div class="popupBox">

<div class="emoji">🛠️</div>

<h2>Maintenance</h2>

<p>
Η σελίδα θα παραμείνει προσωρινά εκτός λειτουργίας
γιατί χρειάζεται διόρθωση.
</p>

<button onclick="window.location.href='contact.html'">
Contact
</button>

</div>

</div>

<!-- SITE (θολό από πίσω) -->

<div id="siteContent">

<h1>G EVENTS</h1>

<hr class="divider">

<h2>Διαθέσιμα Events</h2>

<div class="card">
<h3>Escape Room</h3>
<button class="join-btn">Join</button>
<button class="contact-btn">Contact</button>
</div>

<hr class="divider">

<h2>Mega Events</h2>

<div class="card">
<button class="viewMega">
View Mega Events
</button>
</div>

</div>

</body>
</html>
